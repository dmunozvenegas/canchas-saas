version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: canchas-backend
    ports:
      - "3001:3001"
    volumes:
      # Sincroniza tu código local con el contenedor para que Nodemon detecte los cambios
      - ./backend/src:/app/src
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canchas-frontend
    ports:
      - "5173:5173"
    volumes:
      # Sincroniza tu código local para el Hot Module Replacement (HMR) de Vite
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      # Fuerza a Vite a observar cambios en sistemas de archivos emulados (útil en Mac/Docker)
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    depends_on:
      - backend